<style>
:root{
  --bg:#070a12; --bg2:#0b1120; --panel:#0d1526; --line:#1d2a45;
  --text:#eaeef8; --muted:#9fb0cc; --brand:#38bdf8; --brand2:#22d3ee; --ink:#041018;
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Vazirmatn",system-ui,sans-serif; background:var(--bg); color:var(--text);
  line-height:1.9; overflow-x:clip; font-size:16px;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(600px 400px at 85% -5%, rgba(34,211,238,.14), transparent 60%),
    radial-gradient(700px 500px at 10% 15%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(900px 600px at 50% 110%, rgba(34,211,238,.07), transparent 60%);
}
::selection{background:#22d3ee44}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brand2);outline-offset:3px;border-radius:6px}

/* ---------- reveal (با گارد JS: بدون JS همه‌چیز دیده می‌شود) ---------- */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.js .rv.on{opacity:1;transform:none}

/* ---------- نوار اطلاع خرید ---------- */
.notice{
  background:linear-gradient(90deg,#0e2233,#0b1a2e 50%,#0e2233);
  border-bottom:1px solid var(--line); font-size:.9rem;
}
.notice .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px}
.notice p{color:var(--muted)}
.notice b{color:var(--brand2);font-weight:700}
.notice .btn{margin-inline-start:auto;padding:.45rem 1rem;font-size:.85rem}

/* ---------- ناوبری ---------- */
.nav{position:sticky;top:0;z-index:50;background:#070a12cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;letter-spacing:.02em}
.logo .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center}
.logo .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand2);box-shadow:0 0 12px var(--brand2)}
.nav ul{display:flex;gap:22px;list-style:none;margin-inline-start:auto}
.nav ul a{color:var(--muted);font-size:.92rem;font-weight:500;transition:color .2s}
.nav ul a:hover{color:var(--text)}
.nav .btn{padding:.5rem 1.1rem;font-size:.88rem}
@media(max-width:860px){.nav ul{display:none}}

/* ---------- دکمه‌ها ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:14px;font-weight:700;padding:.8rem 1.5rem;transition:transform .2s,box-shadow .2s,background .2s;border:0;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--brand2),#3b82f6);color:var(--ink);box-shadow:0 10px 32px -10px #22d3ee80}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px -10px #22d3ee99}
.btn-ghost{border:1px solid var(--line);background:#ffffff0a;color:var(--text)}
.btn-ghost:hover{transform:translateY(-2px);background:#ffffff12}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- هیرو ---------- */
.hero{position:relative;padding:88px 0 64px;overflow:hidden}
.rings{position:absolute;inset:-30% -10%;z-index:-1;
  background:repeating-radial-gradient(circle at 78% 25%, transparent 0 86px, rgba(56,189,248,.07) 86px 88px);
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent);
          mask-image:radial-gradient(closest-side,#000,transparent);
  animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--brand2);font-size:.82rem;font-weight:700;letter-spacing:.06em;margin-bottom:18px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand2);box-shadow:0 0 10px var(--brand2);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
h1{font-size:clamp(1.9rem,4.4vw,3.1rem);font-weight:900;line-height:1.45;margin-bottom:18px}
h1 .grad{background:linear-gradient(90deg,var(--brand2),#7dd3fc,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--muted);font-size:1.06rem;max-width:34rem;margin-bottom:30px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .mini{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;color:var(--muted);font-size:.88rem}
.hero .mini span{display:inline-flex;align-items:center;gap:7px}
.hero .mini svg{width:15px;height:15px;color:var(--brand2)}

.panel{position:relative;border-radius:24px;padding:26px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(150deg,#22d3ee66,#38bdf822 45%,transparent) border-box;border:1px solid transparent;box-shadow:0 30px 80px -40px #000}
.panel h3{font-size:.85rem;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;margin-bottom:18px}
.panel h3 em{font-style:normal;font-size:.72rem;color:#64748b}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed #1c2740;font-size:.92rem}
.row:last-of-type{border:0}
.row b{font-weight:800}
.bar{height:6px;border-radius:99px;background:#152036;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand2),#3b82f6)}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero{padding-top:56px}}

/* ---------- مارکی اعتماد ---------- */
.marquee{border-block:1px solid var(--line);background:#0a0f1c;overflow:hidden;direction:ltr}
.marquee .track{display:flex;width:max-content;animation:scroll 30s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.marquee .set{display:flex;gap:0;padding-right:0}
.marquee .set span{direction:rtl;display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;font-weight:500;padding:14px 28px;white-space:nowrap}
.marquee .set span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand2);opacity:.8}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---------- بخش‌ها ---------- */
section{padding:88px 0}
.sec-head{margin-bottom:44px;max-width:44rem}
h2{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:900;line-height:1.5;margin-bottom:10px}
.sec-head p{color:var(--muted)}

/* ---------- کارت اپ‌ها ---------- */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.app{border-radius:var(--r);padding:26px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(160deg,#22d3ee33,transparent 55%) border-box;border:1px solid transparent;transition:transform .25s,box-shadow .25s}
.app:hover{transform:translateY(-6px);box-shadow:0 24px 60px -30px #22d3ee55}
.app .tag{display:inline-block;font-size:.72rem;color:var(--brand2);background:#22d3ee14;border:1px solid #22d3ee33;border-radius:99px;padding:2px 12px;margin-bottom:14px}
.app h3{font-size:1.15rem;font-weight:800;margin-bottom:10px}
.app p{color:var(--muted);font-size:.92rem;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chips i{font-style:normal;font-size:.75rem;color:var(--muted);background:#ffffff08;border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.app .btn{width:100%;justify-content:center;padding:.65rem}

/* ---------- تعرفه‌ها ---------- */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;align-items:stretch}
.plan{position:relative;border-radius:var(--r);padding:28px 24px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(170deg,#22d3ee2e,transparent 50%) border-box;border:1px solid transparent;display:flex;flex-direction:column;transition:transform .25s}
.plan:hover{transform:translateY(-6px)}
.plan.hot{background:linear-gradient(#0f1b30,#0f1b30) padding-box,linear-gradient(160deg,var(--brand2),#3b82f6) border-box;box-shadow:0 30px 80px -40px #22d3ee66}
.plan .badge{position:absolute;top:-14px;inset-inline-start:22px;background:linear-gradient(135deg,var(--brand2),#3b82f6);color:var(--ink);font-size:.72rem;font-weight:800;border-radius:99px;padding:4px 14px}
.plan h3{font-size:1.3rem;font-weight:900}
.plan .dur{color:var(--muted);font-size:.82rem;margin:2px 0 14px}
.plan .price{font-size:1.5rem;font-weight:900;color:var(--brand2)}
.plan .price small{font-size:.8rem;font-weight:500;color:var(--muted)}
.plan .per{font-size:.78rem;color:var(--muted);margin-bottom:18px}
.plan ul{list-style:none;margin-bottom:22px;display:grid;gap:9px}
.plan li{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.plan li svg{width:15px;height:15px;color:var(--brand2);flex:none}
.plan .btn{margin-top:auto;justify-content:center}
.plans-note{margin-top:26px;color:var(--muted);font-size:.92rem;text-align:center}
.plans-note b{color:var(--brand2)}

/* ---------- مراحل ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:st}
.step{position:relative;border-radius:var(--r);padding:28px;background:#0c1322;border:1px solid var(--line)}
.step::before{counter-increment:st;content:counter(st, persian);position:absolute;top:22px;inset-inline-end:24px;font-size:2.6rem;font-weight:900;color:#22d3ee22;line-height:1}
.step h3{font-size:1.05rem;font-weight:800;margin-bottom:10px}
.step p{color:var(--muted);font-size:.92rem}
@media(max-width:820px){.steps{grid-template-columns:1fr}}

/* ---------- راهنما ---------- */
.guide{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.guide article{border-radius:var(--r);padding:26px;background:#0c1322;border:1px solid var(--line)}
.guide h3{font-size:1.05rem;font-weight:800;margin-bottom:10px;color:#cfe9ff}
.guide p{color:var(--muted);font-size:.93rem}
.guide b{color:var(--text)}
@media(max-width:820px){.guide{grid-template-columns:1fr}}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px;justify-content:center}
.tags span{font-size:.78rem;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:5px 14px}

/* ---------- سؤالات ---------- */
.faq{max-width:760px;margin:0 auto;display:grid;gap:12px}
details{border:1px solid var(--line);border-radius:16px;background:#0c1322;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:18px 22px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:10px;height:10px;border-inline-end:2px solid var(--brand2);border-bottom:2px solid var(--brand2);transform:rotate(45deg);transition:transform .25s;flex:none}
details[open] summary::after{transform:rotate(225deg)}
details .a{padding:0 22px 20px;color:var(--muted);font-size:.94rem}

/* ---------- CTA پایانی ---------- */
.band{border-radius:28px;padding:56px 32px;text-align:center;background:
  radial-gradient(500px 220px at 50% 0%, #22d3ee22, transparent 70%), #0c1322;border:1px solid var(--line)}
.band h2{margin-bottom:12px}
.band p{color:var(--muted);margin-bottom:28px}
.band .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ---------- فوتر ---------- */
footer{border-top:1px solid var(--line);padding:44px 0;background:#080b14}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
footer p{color:var(--muted);font-size:.88rem}
footer nav{margin-inline-start:auto;display:flex;gap:18px}
footer nav a{color:var(--muted);font-size:.88rem}
footer nav a:hover{color:var(--text)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .js .rv{opacity:1;transform:none;transition:none}
  .marquee .track,.rings,.eyebrow::before{animation:none}
}
